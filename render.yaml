  - type: web
    name: wigos-portal-poc-catalogue
    runtime: python
    plan: free
    region: frankfurt

    buildCommand: bash scripts/render_build_catalogue.sh

    startCommand: >-
      gunicorn
      --bind 0.0.0.0:$PORT
      --workers 1
      --threads 4
      --timeout 120
      --access-logfile -
      --error-logfile -
      pygeoapi.flask_app:APP

    healthCheckPath: /conformance

    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: PYGEOAPI_CONFIG
        value: catalogue/pygeoapi-config.yml
      - key: PYGEOAPI_OPENAPI
        value: catalogue/openapi.yml
      - key: WIGOS_CATALOGUE_DB
        value: data/wigos-facilities.tinydb
      - key: PYGEOAPI_SERVER_URL
        fromService:
          type: web
          name: wigos-portal-poc-catalogue
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    runtime: static
    name: wigos-portal-poc
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist

    envVars:
      - key: NODE_VERSION
        value: 22.23.2
      - key: SKIP_INSTALL_DEPS
        value: "true"
