services:
  - type: web
    runtime: static
    name: wigos-portal-poc
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22.23.2
      - key: VITE_RECORDS_API_BASE
        fromService:
          type: web
          name: wigos-portal-poc-catalogue
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    runtime: python
    name: wigos-portal-poc-catalogue
    plan: free
    region: frankfurt
    buildCommand: bash scripts/render_build_catalogue.sh
    startCommand: bash scripts/render_start_catalogue.sh
    autoDeployTrigger: commit
    healthCheckPath: /conformance
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: PYGEOAPI_CONFIG
        value: catalogue/pygeoapi-config.yml
      - key: PYGEOAPI_OPENAPI
        value: catalogue/openapi.yml
      - key: WIGOS_CATALOGUE_DB
        value: data/wigos-facilities.tinydb
      - key: PYGEOAPI_SERVER_URL
        fromService:
          type: web
          name: wigos-portal-poc-catalogue
          envVarKey: RENDER_EXTERNAL_URL
