server:
  bind:
    host: 0.0.0.0
    port: ${PORT:-5000}
  url: ${PYGEOAPI_SERVER_URL:-http://localhost:5000}
  mimetype: application/json; charset=UTF-8
  encoding: utf-8
  language: en-US
  cors: true
  pretty_print: true
  map:
    url: https://tile.openstreetmap.org/{z}/{x}/{y}.png
    attribution: 'Map data &copy; <a href="https://openstreetmap.org/copyright">OpenStreetMap contributors</a>'
  admin: false
  limits:
    default_items: 100
    max_items: 5000

logging:
  level: INFO

metadata:
  identification:
    title:
      en: WIGOS Portal PoC Catalogue
    description:
      en: Rebuildable OGC API - Records discovery catalogue projected from WMDR2 JSON records.
    keywords:
      en:
        - WIGOS
        - WMDR2
        - stations
        - observations
    terms_of_service: https://public.wmo.int/
    url: https://wmo.int/
  license:
    name: To be defined for the PoC
    url: https://wmo.int/
  provider:
    name: World Meteorological Organization
    url: https://wmo.int/
  contact:
    name: WIGOS Portal PoC
    email: wigos-portal-poc@example.invalid
    role: pointOfContact

resources:
  wigos-facilities:
    type: collection
    title:
      en: WIGOS facilities
    description:
      en: Facility discovery records derived from canonical WMDR2 JSON.
    keywords:
      en:
        - WIGOS
        - facilities
        - observations
    extents:
      spatial:
        bbox: [-180, -90, 180, 90]
        crs: http://www.opengis.net/def/crs/OGC/1.3/CRS84
    providers:
      - type: record
        name: TinyDBCatalogue
        data: ${WIGOS_CATALOGUE_DB:-data/wigos-facilities.tinydb}
        editable: false
        id_field: id
        time_field: time
        title_field: title
        include_extra_query_parameters: true
